name: CI

on:
  pull_request:
    branches: ['main', 'develop']
    types: [opened, synchronize, reopened]
  push:
    branches: ['main', 'develop']

jobs:
  validate:
    name: Validate PR (Lint, Test, Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check Formatting

        run: npx prettier --check .

      - name: Linting
        run: npm run lint

      - name: Unit Tests with Coverage
        # Runs jest --coverage which enforces the thresholds in package.json:
        # branches: 70%, functions: 78%, lines: 81%, statements: 81%.
        # Jest exits non-zero if any threshold is breached, failing this step.
        run: npm run test:cov

      - name: Coverage threshold summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "=== Coverage Summary ==="
            python3 -c "
import json, sys
with open('coverage/coverage-summary.json') as f:
    d = json.load(f)['total']
for k in ['lines', 'statements', 'functions', 'branches']:
    pct = d[k]['pct']
    print(f'{k}: {pct}%')
"
          else
            echo "Coverage summary not available."
          fi

      - name: Build Verification
        run: npm run build

      - name: 'Audit TEMPORARY: comments have a linked issue (issue #458, ongoing guard per #531)'
        # Every TEMPORARY: comment must reference a GitHub issue using the format
        # 'TEMPORARY: <reason> (issue #NNN)'. This check runs on every PR so new
        # TEMPORARY: workarounds cannot be merged without accountability (issue #531).
        # Existing comments that already include an issue reference are unaffected.
        run: |
          set -euo pipefail
          matches=$(rg -n "TEMPORARY:" --glob '!node_modules' --glob '!dist' \
            --glob '!coverage' --glob '!package-lock.json' . || true)
          if [[ -z "$matches" ]]; then
            echo "No TEMPORARY: comments found — OK."
            exit 0
          fi
          echo "Found TEMPORARY: comment(s):"
          echo "$matches"
          if ! echo "$matches" | rg -q "\(issue #[0-9]+\)"; then
            echo "::error::Every TEMPORARY: comment must reference a GitHub issue, e.g. 'TEMPORARY: <desc> (issue #123)'. See issue #458."
            exit 1
          fi
          echo "All TEMPORARY: comments reference a linked issue — OK."

  migration-drift:
    name: Check Migration Drift
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Snapshot committed migrations
        run: cp -r src/database/migrations /tmp/migrations-committed

      - name: Regenerate migrations from script
        run: ./scripts/generate-migrations.sh --yes

      - name: Diff regenerated migrations against committed
        run: |
          if diff -r /tmp/migrations-committed src/database/migrations > /tmp/migration-drift.txt 2>&1; then
            echo "Migrations are in sync with scripts/generate-migrations.sh."
          else
            echo "::error::src/database/migrations does not match the output of scripts/generate-migrations.sh --yes."
            echo "Regenerate with: ./scripts/generate-migrations.sh --yes"
            cat /tmp/migration-drift.txt
            exit 1
          fi

  stellar-sdk-pin:
    name: Check Stellar SDK Version Pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify @stellar/stellar-sdk is exact-pinned (issue #532)
        run: |
          set -euo pipefail
          VERSION=$(node -e "const p = require('./package.json'); console.log(p.dependencies['@stellar/stellar-sdk'] || p.devDependencies['@stellar/stellar-sdk'] || '');")
          echo "Found @stellar/stellar-sdk version spec: '$VERSION'"
          if [[ -z "$VERSION" ]]; then
            echo "::error::@stellar/stellar-sdk not found in package.json"
            exit 1
          fi
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "@stellar/stellar-sdk is correctly exact-pinned to $VERSION"
          else
            echo "::error::@stellar/stellar-sdk must be exact-pinned (no ^ or ~). Found: '$VERSION'. See README for the manual upgrade process."
            exit 1
          fi
